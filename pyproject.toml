[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-tracker"
version = "0.1.0"
description = "Terminal dashboard that tracks your competitive programming journey (Codeforces, LeetCode, CodeChef)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Snehal Pradhan", email = "snehalpradhan23@gmail.com" },
]
keywords = [
    "competitive-programming", "codeforces", "leetcode", "codechef",
    "tui", "terminal", "cli", "textual", "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Textual",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/snehalpradhan23/cp-tracker"
Repository = "https://github.com/snehalpradhan23/cp-tracker"
Documentation = "https://github.com/snehalpradhan23/cp-tracker"
"Bug Tracker" = "https://github.com/snehalpradhan23/cp-tracker/issues"

[project.scripts]
cp-tracker = "cp_tracker.tui.app:main"

[tool.setuptools.packages.find]
include = ["cp_tracker*"]